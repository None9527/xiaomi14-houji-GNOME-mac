<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Radio services provided by ubuntu26-native-network (Android owns the radios). -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow own="org.bluez"/>
    <allow own="local.ubuntu26.Radios"/>
    <allow own="local.ubuntu26.Display"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.freedesktop.ModemManager1"/>
    <deny send_destination="org.bluez"/>
    <deny send_destination="local.ubuntu26.Radios"/>
    <deny send_destination="local.ubuntu26.Display"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.bluez"/>
    <allow send_destination="local.ubuntu26.Radios"/>
    <allow send_destination="local.ubuntu26.Display"/>
  </policy>
  <policy user="60000">
    <allow send_destination="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.bluez"/>
    <allow send_destination="local.ubuntu26.Radios"/>
    <allow send_destination="local.ubuntu26.Display"/>
  </policy>
</busconfig>
